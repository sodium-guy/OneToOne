<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>인연 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10142a;
    --bg-panel: #1a2044;
    --thread: #c65d43;
    --gold: #e3b23c;
    --text: #f2ede2;
    --muted: #8892b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at top, #1a2050 0%, #10142a 60%);
    color: var(--text);
    font-family: 'Pretendard', sans-serif;
    overflow-x: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .stars {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
  }
  .dot {
    position: absolute; width: 2px; height: 2px; background: var(--gold);
    border-radius: 50%; opacity: .5;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .8; } }

  .card {
    position: relative; z-index: 1;
    max-width: 440px; width: 100%;
    text-align: center;
  }
  .eyebrow {
    letter-spacing: .3em; text-transform: uppercase;
    font-size: 11px; color: var(--gold); margin-bottom: 14px;
    font-weight: 600;
  }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700; font-size: 30px; margin: 0 0 8px;
    line-height: 1.3;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 40px; }

  .thread-wrap {
    position: relative; width: 220px; height: 90px; margin: 0 auto 40px;
  }
  .knot {
    position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold); transform: translateY(-50%);
    box-shadow: 0 0 16px rgba(227,178,60,.6);
  }
  .knot.left { left: 0; animation: floatL 3.4s ease-in-out infinite; }
  .knot.right { right: 0; animation: floatR 3.4s ease-in-out infinite; }
  @keyframes floatL { 0%,100%{ transform: translateY(-50%) translateX(0);} 50%{ transform: translateY(-60%) translateX(4px);} }
  @keyframes floatR { 0%,100%{ transform: translateY(-50%) translateX(0);} 50%{ transform: translateY(-40%) translateX(-4px);} }
  .thread-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .thread-path {
    fill: none; stroke: var(--thread); stroke-width: 1.5; stroke-dasharray: 4 5;
    opacity: .6; animation: dash 2.5s linear infinite;
  }
  @keyframes dash { to { stroke-dashoffset: -40; } }

  .status-box {
    background: var(--bg-panel);
    border: 1px solid rgba(227,178,60,.15);
    border-radius: 16px;
    padding: 28px 24px;
    min-height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
  }
  .waiting-text { color: var(--muted); font-size: 15px; }
  .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
    margin-bottom: 12px; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .3; transform: scale(1);} 50% { opacity: 1; transform: scale(1.4);} }

  .match-label { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
  .my-char {
    font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 26px;
    color: var(--gold); margin: 4px 0 18px;
  }
  .divider { width: 40px; height: 1px; background: var(--thread); margin: 4px 0 14px; opacity: .5;}
  .partner-char {
    font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 22px;
    color: var(--text);
  }

  .timer {
    margin-top: 24px; font-family: 'Noto Serif KR', serif;
    font-size: 42px; font-weight: 700; letter-spacing: .05em;
    color: var(--text);
  }
  .timer.warn { color: var(--thread); }
  .timer-label { font-size: 12px; color: var(--muted); letter-spacing: .15em; margin-top: 4px; }

  .count-badge {
    position: fixed; top: 18px; right: 18px; z-index: 2;
    font-size: 12px; color: var(--muted);
    background: rgba(26,32,68,.7); padding: 6px 12px; border-radius: 100px;
    border: 1px solid rgba(227,178,60,.15);
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="count-badge">현재 접속 <span id="count">0</span>명</div>

  <div class="card">
    <div class="eyebrow">Fated Match</div>
    <h1>당신의 짝을<br/>찾고 있습니다</h1>
    <p class="sub">붉은 실이 연결되면 화면에 표시됩니다</p>

    <div class="thread-wrap" id="threadWrap">
      <svg viewBox="0 0 220 90">
        <path class="thread-path" d="M 7 45 Q 110 10 213 45" />
      </svg>
      <div class="knot left"></div>
      <div class="knot right"></div>
    </div>

    <div class="status-box" id="statusBox">
      <div class="pulse"></div>
      <div class="waiting-text">매칭을 기다리는 중...</div>
    </div>

    <div id="timerBox" style="display:none;">
      <div class="timer" id="timerText">00:00</div>
      <div class="timer-label">TIME REMAINING</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // 배경 별 생성
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 40; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.left = Math.random() * 100 + '%';
      d.style.top = Math.random() * 100 + '%';
      d.style.animationDelay = (Math.random() * 3) + 's';
      starsEl.appendChild(d);
    }

    let clientId = localStorage.getItem("clientId");

if (!clientId) {
    clientId = crypto.randomUUID();
    localStorage.setItem("clientId", clientId);
}

const socket = io({
    auth: {
        clientId: clientId
    }
});
    const statusBox = document.getElementById('statusBox');
    const threadWrap = document.getElementById('threadWrap');
    const timerBox = document.getElementById('timerBox');
    const timerText = document.getElementById('timerText');
    const countEl = document.getElementById('count');

    socket.on('participantCount', (n) => { countEl.textContent = n; });

    socket.on('matched', ({ me, partner }) => {
      threadWrap.style.opacity = '0.25';
      statusBox.innerHTML = `
        <div class="match-label">당신은</div>
        <div class="my-char">${me}</div>
        <div class="divider"></div>
        <div class="match-label">당신의 짝꿍은</div>
        <div class="partner-char">${partner}</div>
      `;
    });

    socket.on('matchWaiting', () => {
      statusBox.innerHTML = `
        <div class="pulse"></div>
        <div class="waiting-text">이번 라운드는 인원 초과로 대기 중입니다</div>
      `;
    });

    socket.on('matchReset', () => {
      threadWrap.style.opacity = '1';
      statusBox.innerHTML = `
        <div class="pulse"></div>
        <div class="waiting-text">매칭을 기다리는 중...</div>
      `;
      timerBox.style.display = 'none';
    });

    let timerInterval = null;
    socket.on('timerStatus', (state) => {
      clearInterval(timerInterval);
      if (!state.running || !state.endTime) {
        timerBox.style.display = 'none';
        return;
      }
      timerBox.style.display = 'block';
      const tick = () => {
        const remain = Math.max(0, Math.round((state.endTime - Date.now()) / 1000));
        const m = String(Math.floor(remain / 60)).padStart(2, '0');
        const s = String(remain % 60).padStart(2, '0');
        timerText.textContent = `${m}:${s}`;
        timerText.classList.toggle('warn', remain <= 10);
        if (remain <= 0) clearInterval(timerInterval);
      };
      tick();
      timerInterval = setInterval(tick, 250);
    });
  </script>
</body>
</html>
