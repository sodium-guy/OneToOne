<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인연 찾기 - 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10142a;
    --bg-panel: #1a2044;
    --thread: #c65d43;
    --gold: #e3b23c;
    --text: #f2ede2;
    --muted: #8892b0;
    --line: rgba(227,178,60,.15);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a2050 0%, #10142a 60%);
    color: var(--text); font-family: 'Pretendard', sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 {
    font-family: 'Noto Serif KR', serif; font-size: 24px; margin: 0 0 4px;
  }
  .eyebrow { font-size: 11px; letter-spacing: .3em; color: var(--gold); text-transform: uppercase; font-weight: 700;}
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 32px; }

  .panel {
    background: var(--bg-panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px; letter-spacing: .05em; color: var(--gold); margin: 0 0 16px;
    font-weight: 600;
  }
  input {
    background: #0d1226; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 10px 14px; font-size: 14px; width: 100%;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    background: var(--gold); color: #1a1200; border: none; border-radius: 8px;
    padding: 11px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
    font-family: inherit; transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.secondary {
    background: transparent; color: var(--text); border: 1px solid var(--line);
  }
  button.danger { background: var(--thread); color: #fff; }
  button:disabled { opacity: .35; cursor: not-allowed; }

  .row { display: flex; gap: 10px; align-items: center; }
  .row + .row { margin-top: 12px; }

  #loginPanel { max-width: 380px; margin: 80px auto 0; text-align: center; }
  #loginPanel .row { flex-direction: column; }
  #loginError { color: var(--thread); font-size: 13px; margin-top: 10px; min-height: 16px; }

  #main { display: none; }

  .stat {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .stat:last-child { border-bottom: none; }
  .stat b { font-family: 'Noto Serif KR', serif; font-size: 20px; color: var(--gold); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 11px;
  }
  .badge.idle { background: rgba(136,146,176,.15); color: var(--muted); }
  .badge.matched { background: rgba(227,178,60,.15); color: var(--gold); }

  #msg { font-size: 13px; color: var(--gold); min-height: 18px; margin-top: 10px; }

  .timer-input { display: flex; gap: 8px; align-items: center; }
  .timer-input input { width: 70px; text-align: center; }
  .timer-input span { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="loginPanel">
      <div class="eyebrow">Admin</div>
      <h1>관리자 로그인</h1>
      <div class="sub">비밀번호를 입력하세요</div>
      <div class="row">
        <input type="password" id="pwInput" placeholder="비밀번호" />
        <button onclick="login()">입장</button>
      </div>
      <div id="loginError"></div>
    </div>

    <div id="main">
      <div class="eyebrow">Admin Console</div>
      <h1>인연 찾기 관리자</h1>
      <div class="sub">매칭과 타이머를 제어합니다</div>

      <div class="panel">
        <h2>현황</h2>
        <div class="stat"><span>전체 접속</span><b id="statTotal">0</b></div>
        <div class="stat"><span>대기 중</span><b id="statIdle">0</b></div>
        <div class="stat"><span>매칭됨</span><b id="statMatched">0</b></div>
      </div>

      <div class="panel">
        <h2>매칭 제어</h2>
        <div class="row">
          <button onclick="startMatching()">매칭 시작</button>
          <button class="secondary" onclick="resetMatching()">다음 라운드로 초기화</button>
        </div>
        <div id="msg"></div>
      </div>

      <div class="panel">
        <h2>타이머 제어</h2>
        <div class="row timer-input">
          <input type="number" id="minInput" value="3" min="0" /><span>분</span>
          <input type="number" id="secInput" value="0" min="0" max="59" /><span>초</span>
          <button onclick="startTimer()">타이머 시작</button>
          <button class="secondary" onclick="stopTimer()">정지</button>
        </div>
      </div>

      <div class="panel">
        <h2>접속자 목록</h2>
        <table>
          <thead><tr><th>ID</th><th>상태</th></tr></thead>
          <tbody id="deviceTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function login() {
      const pw = document.getElementById('pwInput').value;
      socket.emit('adminLogin', pw, (res) => {
        if (res.ok) {
          document.getElementById('loginPanel').style.display = 'none';
          document.getElementById('main').style.display = 'block';
        } else {
          document.getElementById('loginError').textContent = res.error;
        }
      });
    }
    document.getElementById('pwInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    function startMatching() { socket.emit('startMatching'); }
    function resetMatching() { socket.emit('resetMatching'); }
    function startTimer() {
      const min = Number(document.getElementById('minInput').value) || 0;
      const sec = Number(document.getElementById('secInput').value) || 0;
      const total = min * 60 + sec;
      if (total <= 0) return alert('시간을 입력하세요.');
      socket.emit('startTimer', total);
    }
    function stopTimer() { socket.emit('stopTimer'); }

    socket.on('adminMessage', (text) => {
      document.getElementById('msg').textContent = text;
    });

    socket.on('deviceList', (list) => {
      const idle = list.filter(d => d.status === 'idle').length;
      const matched = list.filter(d => d.status === 'matched').length;
      document.getElementById('statTotal').textContent = list.length;
      document.getElementById('statIdle').textContent = idle;
      document.getElementById('statMatched').textContent = matched;

      const tbody = document.getElementById('deviceTable');
      tbody.innerHTML = list.map(d => `
        <tr>
          <td>${d.id.slice(0,8)}</td>
          <td><span class="badge ${d.status}">${d.status === 'idle' ? '대기' : '매칭됨'}</span></td>
        </tr>
      `).join('');
    });
  </script>
</body>
</html>
